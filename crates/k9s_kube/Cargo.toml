[package]
name = "k9s_kube"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-channel = "2.5.0"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
k9s_core = { workspace = true }
k9s_render = { workspace = true }
kube = { version = "4.0.0", features = ["runtime", "client", "rustls-tls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "macros"] }
serde_yaml = "0.9"
futures = "0.3"
